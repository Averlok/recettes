<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<script>
  (function() {
    function injectButtons() {
      // Aller chercher tous les titres h1, h2, h3, h4
      const headers = document.querySelectorAll("h1, h2, h3, h4");

      headers.forEach(function(header) {
        // Ignorer si déjà traité ou si c'est le titre principal du site
        if (header.hasAttribute("data-msg-ok")) return;
        if (!header.innerText || header.innerText.trim() === "") return;

        header.setAttribute("data-msg-ok", "true");

        // 1. Créer le slug propre sans aucun accent
        const cleanSlug = header.innerText
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

        header.id = cleanSlug;

        // 2. Créer le bouton 🔗
        const btn = document.createElement("button");
        btn.innerHTML = " 🔗";
        btn.style.cssText = "background:none !important; border:none !important; cursor:pointer !important; font-size:0.75em !important; display:inline-block !important;";
        btn.title = "Copier le lien pour Messenger";

        btn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();

          const url = window.location.origin + window.location.pathname + "#" + cleanSlug;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function() {
              alert("Lien propre copié !");
            }).catch(function() {
              prompt("Copie ce lien :", url);
            });
          } else {
            prompt("Copie ce lien :", url);
          }
        };

        header.appendChild(btn);
      });
    }

    // Surveiller les changements dans le DOM en temps réel
    const observer = new MutationObserver(function() {
      injectButtons();
    });

    document.addEventListener("DOMContentLoaded", function() {
      injectButtons();
      observer.observe(document.body, { childList: true, subtree: true });
    });
  })();
</script>
