<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Tri de la TOC
    const toc = document.getElementById("markdown-toc");
    if (toc) {
      const items = Array.from(toc.children);
      items.sort((a, b) => a.textContent.trim().localeCompare(b.textContent.trim(), 'fr'));
      items.forEach(item => toc.appendChild(item));
    }

    // 2. Tri des recettes (sections H2 ou H3)
    const mainContent = document.querySelector(".main-content, main, article, #main-content") || document.body;
    
    // On cherche les H2 ou H3 dans la page
    const headings = Array.from(mainContent.querySelectorAll("h2, h3"));
    if (headings.length === 0) return;

    const recipes = [];

    headings.forEach(heading => {
      // On ignore ce qui est dans la TOC
      if (heading.closest("#markdown-toc")) return;

      const tag = heading.tagName;
      const nodes = [heading];
      let sibling = heading.nextSibling;

      // Rassembler tout le contenu jusqu'au prochain titre de même niveau ou supérieur
      while (sibling && sibling.tagName !== tag) {
        const next = sibling.nextSibling;
        nodes.push(sibling);
        sibling = next;
      }

      recipes.push({
        title: heading.textContent.trim(),
        parent: heading.parentNode,
        nodes: nodes
      });
    });

    // Tri par ordre alphabétique
    recipes.sort((a, b) => a.title.localeCompare(b.title, 'fr'));

    // Réinsertion propre sans avertissement TypeScript
    recipes.forEach(recipe => {
      recipe.nodes.forEach((/** @type {Node} */ node) => {
        recipe.parent.appendChild(node);
      });
    });
  });
</script>
