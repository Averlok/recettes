<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Tri alphabétique de la TOC
    const toc = document.getElementById("markdown-toc");
    if (toc) {
      const items = Array.from(toc.children);
      items.sort((a, b) => a.textContent.trim().localeCompare(b.textContent.trim(), 'fr'));
      items.forEach((/** @type {Node} */ item) => toc.appendChild(item));
    }

    // 2. Tri alphabétique des recettes
    const mainContent = document.querySelector(".main-content, main, article, #main-content") || document.body;
    const headings = Array.from(mainContent.querySelectorAll("h2, h3")).filter(
      h => !h.closest("#markdown-toc") && !h.classList.contains("nav-panel-title")
    );

    if (headings.length < 2) return;

    // Isoler le premier titre pour savoir où commence la liste des recettes
    const firstHeading = headings[0];
    const recipeContainer = document.createElement("div");
    recipeContainer.id = "recipes-wrapper";
    
    // Insérer le wrapper juste avant la première recette
    firstHeading.parentNode.insertBefore(recipeContainer, firstHeading);

    const recipes = [];

    headings.forEach(heading => {
      const tag = heading.tagName;
      const nodes = [heading];
      let sibling = heading.nextSibling;

      // Rassembler tout le contenu de la recette (y compris les <hr>)
      while (sibling) {
        const next = sibling.nextSibling;
        if (sibling.nodeType === 1) { // Element node
          const el = /** @type {HTMLElement} */ (sibling);
          if (['H1', 'H2', tag].includes(el.tagName)) {
            break;
          }
        }
        nodes.push(sibling);
        sibling = next;
      }

      recipes.push({
        title: heading.textContent.trim(),
        nodes: nodes
      });
    });

    // Trier les recettes par ordre alphabétique
    recipes.sort((a, b) => a.title.localeCompare(b.title, 'fr'));

    // Déplacer les recettes triées DANS le wrapper dédié
    recipes.forEach(recipe => {
      recipe.nodes.forEach((/** @type {Node} */ node) => {
        recipeContainer.appendChild(node);
      });
    });
  });
</script>
